<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pedidos - Dulces Delicias</title>
    <link rel="stylesheet" href="css/global.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .admin-container { max-width: 1000px; margin: 40px auto; }
        .table-admin { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .table-admin th, .table-admin td { padding: 15px; border-bottom: 1px solid #eee; text-align: left; }
        .status-badge { padding: 5px 10px; border-radius: 15px; font-size: 0.85em; font-weight: bold; }
    </style>
</head>
<body class="admin-layout">

    <header class="header">
        <div class="container header-content">
            <div class="logo">
                <img src="img/logo mejorado.png" alt="Logo Dulces Delicias">
            </div>
            <h1>Gestión de Pedidos</h1>
            <nav class="main-nav">
                <ul class="nav-list">
                    <li><a href="home.html">Inicio</a></li>
                    <li><a href="nuestrosProductos.html">Productos</a></li>
                    <li><a href="homeAdmin.html">Administrador</a></li>
                </ul>
            </nav>
            <button id="logout" class="btn btn-primary call-to-action">Logout <i class="fas fa-sign-out-alt"></i></button>
        </div>
    </header>

    <main class="container admin-container">
        <div class="table-container">
            <h2>Pedidos Recibidos</h2>
            <table class="table-admin">
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Productos</th>
                        <th>Total</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tbody-pedidos">
                    </tbody>
            </table>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <div class="social-links">
                <a href="https://www.facebook.com/share/1b6KKj8rv3/" target="_blank" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="https://www.instagram.com/dulce_delicias05?igsh=MWYzdGk1anViNW9lag==" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="https://www.tiktok.com/@gloriagalvis363?_r=1&_t=ZS-92HcTF0R5MN" target="_blank" aria-label="Tiktok"><i class="fab fa-tiktok"></i></a>
            </div>
            <p>&copy; 2025 Dulces Delicias. Todos los derechos reservados.</p>
            <p>Diseñado con <i class="fas fa-heart"></i> por [Dilan Galvis / Brayan Vásquez / Ronal Álvarez / Juan Graciano / Andrey Estrada]</p>
        </div>
    </footer>

    <script src="js/crudPedidos.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
