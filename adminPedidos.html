<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pedidos - Dulces Delicias</title>
    <link rel="stylesheet" href="css/global.css">
    <style>
        .admin-container { max-width: 1000px; margin: 40px auto; }
        .table-admin { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .table-admin th, .table-admin td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        .status-badge { padding: 5px 10px; border-radius: 15px; font-size: 0.8em; }
    </style>
</head>
<body>

    <header class="header">
        <div class="container header-content">
            <h1>Gestión de Pedidos</h1>
            <nav><a href="home.html">Volver al Inicio</a></nav>
        </div>
    </header>

    <main class="container admin-container">
        <table class="table-admin">
            <thead>
                <tr>
                    <th>Cliente</th>
                    <th>Producto</th>
                    <th>Total</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tbody-pedidos">
                </tbody>
        </table>
    </main>

    <script src="js/crudPedidos.js"></script>
</body>
</html>
