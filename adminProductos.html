<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/global.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Gestión de Productos</title>
</head>
<body class="container mt-4">
 
    <h1>Gestión de Productos</h1>
    <button id="logout" class="btn btn-secondary mb-3">Logout</button>
 
    <section class="card p-4 mb-4">
        <h2>Crear / Editar Producto</h2>
        <form id="productForm" class="row g-3">
            <input type="hidden" id="id_product">
            
            <div class="col-md-3"><label>Nombre</label><input type="text" id="name" class="form-control" required></div>
            <div class="col-md-3"><label>Sabor</label><input type="text" id="flavor" class="form-control"></div>
            <div class="col-md-3"><label>Precio</label><input type="number" id="price" class="form-control" required></div>
            <div class="col-md-3"><label>Stock</label><input type="number" id="stock" class="form-control"></div>
            <div class="col-md-3"><label>Estado</label><input type="text" id="state" class="form-control"></div>
            <div class="col-md-3">
                <label>Categoría</label>
                <select id="product_type" class="form-control" onchange="actualizarCampos()">
                    <option value="">Seleccione...</option>
                    <option value="Tortas">Tortas</option>
                    <option value="Postres">Postres</option>
                    <option value="Cupcakes">Cupcakes</option>
                    <option value="Galletas">Galletas</option>
                </select>
            </div>

            <div id="campo-tortas" class="col-md-3 d-none">
                <label>Porciones</label>
                <select id="slices" class="form-control">
                    <option value="12">12</option><option value="20">20</option><option value="30">30</option>
                </select>
            </div>

            <div id="campo-postres" class="col-md-3 d-none">
                <label>Tamaño</label>
                <select id="size-pastry" class="form-control">
                    <option value="Pequeño">Pequeño</option><option value="Mediano">Mediano</option><option value="Grande">Grande</option>
                </select>
            </div>

            <div id="campo-cupcakes" class="col-md-3 d-none">
                <label>Cobertura</label>
                <select id="flavor" class="form-control">
                    <option value="Chocolate">Chocolate</option><option value="Vainilla">Vainilla</option><option value="Frutos Rojos">Frutos Rojos</option>
                </select>
            </div>

            <div id="campo-galletas" class="col-md-3 d-none">
                <label>Tipo</label>
                <select id="type-cookie" class="form-control"> <option value="Crujiente">Crujiente</option><option value="Suave">Suave</option>
                </select>
            </div>     
                   
            <div class="col-12">
                <button type="submit" id="btnGuardar" class="btn btn-success">Guardar</button>
            </div>
        </form>
    </section>

    <table class="table table-striped" id="tablaProductos">
        <thead>
            <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>Sabor</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Tipo</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tbody">
            </tbody>
    </table>

    <script src="js/crudProductos.js"></script>
    <script src="js/logout.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
