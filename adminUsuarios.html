<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/global.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Administrador de Usuarios</title>
</head>
<body>
  
        <h1>Administrador de Usuarios</h1>
        <button id="logout">Logout</button>
  
  <section>
        <div class="contact-form"></div>
        <h2>Crear Usuarios Nuevos</h2>
        <form id="signupForm">
            <div class="form-group">
            <label>Nombre</label>
            <input type="text" placeholder="..." id="name" required autofocus>
            </div>
            <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="..." id="email" required>
            </div>
            <div class="form-group">
            <label>Contraseña</label>
            <input type="password" placeholder="..." id="password" required>
            </div>
            <div class="form-group">
            <label>rol</label>
            <select type="rol" id="rol" required>
              <option value="cliente">Cliente</option>
              <option value="admin">Administrador</option>
            </select>
                        
              <button type="submit" class="btn btn-primary">Guardar</button>
              <button type="submit" class="btn btn-primary">Actualizar</button>
            </div>
          </form>
        </div>       
  </section>

    <table class="table" id = "tablaUsuarios">
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Nombre</th>
      <th scope="col">Correo</th>
      <th scope="col">Contraseña</th>
      <th scope="col">Rol</th>
      <th scope="col">Acciones</th>
    </tr>
  </thead>
  <tbody id="tbody">
    <tr>
      <th scope="row">1</th>
      <td>Mark</td>
      <td>Otto</td>
      <td>mark.o@mdo</td>
      <td>Admin</td>
      <td>
        <button class="btn btn-primary btnActualizar">Actualizar</button>
        <button class="btn btn-danger btnEliminar">Eliminar</button>
      </td>
    </tr>


  </tbody>
</table>
    <script src="js/crudUsuarios.js"></script>
    <script src="js/logout.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
