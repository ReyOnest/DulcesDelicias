<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/global.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Administrador de Usuarios</title>
</head>
<body class="admin-layout">

    <header class="header">
        <div class="container header-content">
            <div class="logo">
                <img src="img/logo mejorado.png" alt="Logo Dulces Delicias">
            </div>
            <h1>Administrador de Usuarios</h1>
            <nav class="main-nav">
                <ul class="nav-list">
                    <li><a href="home.html">Inicio</a></li>
                    <li><a href="nuestrosProductos.html">Productos</a></li>
                    <li><a href="homeAdmin.html">Administrador</a></li>
                </ul>
            </nav>
            <button id="logout" class="btn btn-primary call-to-action">Logout <i class="fas fa-sign-out-alt"></i></button>
        </div>
    </header>

    <main class="container">
        <div class="table-container">
            <h2>Crear Nuevo Usuario</h2>
            <form id="signupForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" id="password" required>
                    </div>
                    <div class="form-group">
                        <label>Rol</label>
                        <select id="rol" required>
                            <option value="cliente">Cliente</option>
                            <option value="admin">Administrador</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Registrar Usuario</button>
            </form>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Rol</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tbody">
                    </tbody>
            </table>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <div class="social-links">
                <a href="https://www.facebook.com/share/1b6KKj8rv3/" target="_blank" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="https://www.instagram.com/dulce_delicias05?igsh=MWYzdGk1anViNW9lag==" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="https://www.tiktok.com/@gloriagalvis363?_r=1&_t=ZS-92HcTF0R5MN" target="_blank" aria-label="Tiktok"><i class="fab fa-tiktok"></i></a>
            </div>
            <p>&copy; 2025 Dulces Delicias. Todos los derechos reservados.</p>
            <p>Diseñado con <i class="fas fa-heart"></i> por [Dilan Galvis / Brayan Vásquez / Ronal Álvarez / Juan Graciano / Andrey Estrada]</p>
        </div>
    </footer>

    <script src="js/crudUsuarios.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
