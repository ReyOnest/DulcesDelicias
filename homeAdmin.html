<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Dulces Delicias</title>
    <script src="js/homeAdmin.js"></script>
    <link rel="stylesheet" href="css/global.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        .admin-nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        .admin-card {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 1px solid #eee;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="container header-content">
            <h1>Panel Admin</h1>
            <nav>
                <a href="home.html">Inicio</a>
                <a href="nuestrosProductos.html">Productos</a>
                <button id="logout" class="btn btn-outline">Logout</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <h2>Bienvenido, Administrador</h2>
        
        <div class="admin-nav-grid">
            <div class="admin-card">
                <h3>Gestión de Productos</h3>
                <a href="adminProductos.html" class="btn btn-primary">Entrar</a>
            </div>
            
            <div class="admin-card">
                <h3>Gestión de Usuarios</h3>
                <a href="adminUsuarios.html" class="btn btn-primary">Entrar</a>
            </div>
            
            <div class="admin-card">
                <h3>Gestión de Pedidos</h3>
                <a href="adminPedidos.html" class="btn btn-primary">Entrar</a>
            </div>
        </div>
    </main>

    <script>
        // Lógica simple para el botón de Logout
        document.getElementById('logout').addEventListener('click', () => {
            sessionStorage.removeItem('sesionUsuario');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
