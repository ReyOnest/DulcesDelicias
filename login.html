<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/global.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Login</title>
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <div class="logo">
                <img src="img/logo mejorado.png" alt="Logo Dulces Delicias">
            </div>
            <h1>Login</h1>
            <nav class="main-nav">
                <ul class="nav-list">
                    <li><a href="home.html">Inicio</a></li>
                    <li><a href="nuestrosProductos.html">Productos</a></li>
                    <li><a href="registroClientes.html">Registro</a></li>
                </ul>
            </nav>
             <a href="carrito.html" class="btn btn-primary call-to-action">Ver Carrito<i class="fas fa-shopping-cart"></i></a>
        </div>
    </header>
    <section class="container" style="max-width: 600px; padding: 40px 20px;">
        <div class="contact-form" style="background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
            <h2 style="color: var(--primary-color);">Inicia Sesión</h2>
            <p style="text-align: center; margin-bottom: 20px;">¡Qué bueno verte de nuevo!</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="ejemplo@correo.com" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="********" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Ingresar</button>
            </form>
            
            <p style="text-align: center; margin-top: 20px;">
                ¿No tienes cuenta? <a href="registroClientes.html" style="color: var(--secondary-color); font-weight: bold;">Regístrate aquí</a>
            </p>
        </div>
    </section>        <footer class="footer">
        <div class="container footer-content">
            <div class="social-links">
                <a href="https://www.facebook.com/share/1b6KKj8rv3/" target="_blank" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="https://www.instagram.com/dulce_delicias05?igsh=MWYzdGk1anViNW9lag==" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="https://www.tiktok.com/@gloriagalvis363?_r=1&_t=ZS-92HcTF0R5MN" target="_blank" aria-label="Tiktok"><i class="fab fa-tiktok"></i></a>
            </div>
            <p>&copy; 2025 Dulces Delicias. Todos los derechos reservados.</p>
            <p>Diseñado con <i class="fas fa-heart"></i> por [Dilan Galvis / Brayan Vásquez / Ronal Álvarez / Juan Graciano / Andrey Estrada]</p>
        </div>
        </footer>

    <script src="js/login.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
