<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/global.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>Registro</title>
</head>
<body>
    <section>
        <div class="contact-form">
        <h2>Registro</h2>
        <form id="signupForm">
            <div class="form-group">
            <label>Nombre</label>
            <input type="text" placeholder="..." id="name" autofocus>
            </div>
            <div class="form-group">
            <label>Mail</label>
            <input type="email" placeholder="..." id="email">
            </div>
            <div class="form-group">
            <label>Contraseña</label>
            <input type="password" placeholder="..." id="password">
            </div>
            <button type="submit" class="btn btn-primary">Registro</button>
        </form>
        </div>
        <p>Ya tienes una cuenta? <a href="login.html">Login</a></p>
    </section>
    <script src="js/registroClientes.js"></script>
</body>
</html>
