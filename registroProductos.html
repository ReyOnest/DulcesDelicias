<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"> 
    <title>Gestión de Productos</title>
</head>
<body class="container mt-4">
 
    <h1>Gestión de Productos</h1>
    <button id="logout" class="btn btn-secondary mb-3">Logout</button>
 
    <section class="card p-4 mb-4">
        <h2>Crear / Editar Producto</h2>
        <form id="productForm" class="row g-3">
            <input type="hidden" id="id_product">
            
            <div class="col-md-3"><label>Nombre</label><input type="text" id="name" class="form-control" required></div>
            <div class="col-md-3"><label>Sabor</label><input type="text" id="flavor" class="form-control"></div>
            <div class="col-md-3"><label>Precio</label><input type="number" id="price" class="form-control" required></div>
            <div class="col-md-3"><label>Stock</label><input type="number" id="stock" class="form-control"></div>
            <div class="col-md-3"><label>Estado</label><input type="text" id="state" class="form-control"></div>
            <div class="col-md-3"><label>Tipo (Category)</label><input type="text" id="product_type" class="form-control"></div>
            <div class="col-md-3"><label>Porciones</label><input type="number" id="slices" class="form-control"></div>
            <div class="col-md-3"><label>Tamaño</label><input type="text" id="size" class="form-control"></div>
            
            <div class="col-12">
                <button type="submit" id="btnGuardar" class="btn btn-success">Guardar</button>
            </div>
        </form>
    </section>

    <table class="table table-striped" id="tablaProductos">
        <thead>
            <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>Sabor</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Tipo</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tbody">
            </tbody>
    </table>

    <script src="js/crudProductos.js"></script>
    <script src="js/logout.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
